# CalShadow mit fertigem Image betreiben.
# 1. Diese Datei z. B. nach /opt/calshadow/compose.yaml kopieren
# 2. Daneben eine .env anlegen (Modus 600):  WEB_PASSWORD=ein-langes-passwort
# 3. mkdir -p data && sudo chown 1000:1000 data
# 4. docker compose up -d   ->  http://<host>:8080  (Benutzer admin)
# Update: Version unten erhöhen, dann `docker compose pull && docker compose up -d`.
name: calshadow

services:
  calshadow:
    image: ghcr.io/antrilas/calshadow:1.1.0   # alternativ: antrilas/calshadow:1.1.0 (Docker Hub)
    container_name: calshadow
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      WEB_USER: admin
      WEB_PASSWORD: ${WEB_PASSWORD:?WEB_PASSWORD in .env setzen}
    volumes:
      - ./data:/data
    # Für Homepage / Uptime Kuma in einem gemeinsamen Docker-Netzwerk:
    # networks: [default, monitoring]

# networks:
#   monitoring:
#     external: true
